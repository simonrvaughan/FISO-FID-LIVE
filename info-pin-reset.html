<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>FISOFID — INFO PIN reset</title><style>body{margin:0;background:#0c151e;color:#e7edf2;font:16px system-ui;display:grid;min-height:100dvh;place-items:center}main{max-width:360px;padding:24px}input,button{display:block;box-sizing:border-box;width:100%;padding:11px;margin:8px 0 20px}input{background:#17212b;color:white;border:1px solid #8195a4}p{line-height:1.5}a{color:#b8d8f1}</style><script defer src="info-pin-reset.js?v=459"></script></head><body><main><h1>INFO administrator PIN</h1><p>Choose a separate 6–12 digit PIN. This does not change the User 001 password. The link is single use and expires after 15 minutes.</p><form><label for="newPin">New PIN</label><input id="newPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" minlength="6" maxlength="12" autocomplete="new-password" required><label for="confirmPin">Confirm new PIN</label><input id="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" minlength="6" maxlength="12" autocomplete="new-password" required><button>Set INFO PIN</button></form><p role="status" aria-live="polite"></p><a href="/">Return to FISOFID</a></main></body></html>
